[package]
name = "twelve_factor"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs"] }
tera = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
comrak = "0.21"
gray_matter = "0.2"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
grass = "0.13"
notify = "6.0"
reqwest = "0.11"
sha2 = "0.10.9"
libc = "0.2.172"

[dev-dependencies]
reqwest = "0.11"
